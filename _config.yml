title: O Carro Elétrico
description: Esclarecer dúvidas e boas práticas no uso desta nova forma de transporte.
# Para o <html lang> e o endereço canónico (jekyll-seo-tag).
lang: pt-PT
locale: pt_PT
url: https://ocarroeletrico.com
image: /assets/og-image.png
logo: /assets/og-image.png

# Tema próprio (sem remote_theme): sem pedidos ao Google Fonts, sem CSS que
# não controlamos. Ver _layouts/default.html e assets/css/site.css.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
    values:
      layout: default

# Documentos de trabalho que não são páginas do site.
exclude:
  - AUDITORIA.md
  - README.md
  - LICENSE
  - scripts
  - .github

footer_links:
  - label: GitHub
    url: https://github.com/CarregaErvilhas/OCarroEletrico
  - label: Postos MOBI.E ordenados por custo do OPC
    url: /Postos/
  - label: NAP, mapa live da rede
    url: https://nap.ocarroeletrico.com/
  - label: ohmigo, custo de carregar no ChatGPT e no Claude
    url: https://ohmigo.ocarroeletrico.com/
  - label: Comparador CEME
    url: https://ceme.ocarroeletrico.com/
  - label: Simuladores
    url: https://simuladores.ocarroeletrico.com/

kramdown:
  toc_levels: 2..3
