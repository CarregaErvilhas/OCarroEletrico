# Reusable DCO check: every commit in a pull request must carry a Signed-off-by matching its
# author. The rule is scripts/check-dco.sh of the repo that hosts this file, never the caller's
# copy, so a pull request can't edit the script that checks it. See docs/shared-ci.md.
name: DCO check
on:
  workflow_call:
permissions:
  contents: read
jobs:
  dco:
    # Dependabot signs off as support@github.com but authors as its noreply address, so the check
    # would always fail. Skipped only when Dependabot opened the PR and triggered this run: a
    # spoofed commit author is not enough. A skipped job counts as passing for the ruleset.
    if: ${{ !(github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]') }}
    runs-on: ubuntu-latest
    steps:
      # Fail closed: with an empty repository or ref, actions/checkout falls back to the caller's
      # pull request, which would then supply its own script.
      - name: Resolve the script's source
        env:
          HOST_REPO: ${{ job.workflow_repository }}
          # The commit of this workflow file, which is the SHA the caller pinned. When the host
          # repo calls itself, that commit is the PR's merge commit, so the base commit is used.
          SCRIPT_REF: ${{ job.workflow_repository == github.repository && github.event.pull_request.base.sha || job.workflow_sha }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "script: $HOST_REPO@$SCRIPT_REF (workflow at $WORKFLOW_SHA)"
          if [ -z "$HOST_REPO" ] || [ -z "$SCRIPT_REF" ]; then echo "::error::unknown script source"; exit 1; fi
          if [ -z "$BASE" ] || [ -z "$HEAD" ]; then echo "::error::call this workflow from a pull_request run"; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_repository == github.repository && github.event.pull_request.base.sha || job.workflow_sha }}
          path: host
          persist-credentials: false
      # The PR checkout is only data (its commits); no file from it is executed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - working-directory: pr
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: ../host/scripts/check-dco.sh "$BASE..$HEAD"
