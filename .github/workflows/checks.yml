# The pages against Voltaria (scripts/check.py): legal citations, numbers and dates from the skill,
# no money in the prose, glossary, tone warnings, and a full build.
name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - run: scripts/check.py
