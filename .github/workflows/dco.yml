# Every commit in a PR must carry a Signed-off-by matching its author (see
# CONTRIBUTING.md). The check is dco-check.yml, shared with the group's other repos; here it runs
# the base branch's scripts/check-dco.sh, so changes to the script only take effect once merged.
name: DCO
on: pull_request
permissions:
  contents: read
jobs:
  dco:
    uses: ./.github/workflows/dco-check.yml
