# Builds the site (scripts/build.py) and publishes it on GitHub Pages at https://ocarroeletrico.com/.
# Runs on every push to main, by hand, and every Monday: incentives open and close by date, and the
# build is what moves them, so the site follows the calendar without a new commit.
# One-time setup in the repo settings: Pages, Source "GitHub Actions" (custom domain ocarroeletrico.com).
name: Pages
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - run: scripts/check.py
      - run: scripts/build.py --out _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
