version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly", day: "monday", time: "09:00" }
    cooldown: { default-days: 14 }
    open-pull-requests-limit: 1
    labels: ["dependencies", "github-actions"]
    commit-message: { prefix: "deps(actions)", include: "scope" }

  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule: { interval: "weekly", day: "monday", time: "09:00" }
    # One per submodule: a Voltaria bump waiting for its rewrite doesn't hold back a Brand release.
    open-pull-requests-limit: 2
    labels: ["dependencies", "submodules"]
    commit-message: { prefix: "deps(submodules)" }
